[build-system]
requires = ['setuptools>=69', 'wheel']
build-backend = 'setuptools.build_meta'

[project]
name = 'hdb-compnet'
version = '0.1.0'
description = 'Retrieval-augmented neural network for Singapore HDB resale price modelling'
readme = 'README.md'
requires-python = '>=3.11,<3.13'
license = {text = 'MIT'}
authors = [
    {name = 'Pavel Eshmeev'},
]
dependencies = [
    'matplotlib>=3.8',
    'numpy>=1.26',
    'pandas>=2.1',
    'pyyaml>=6.0',
    'scikit-learn>=1.4',
    'scipy>=1.11',
    'torch>=2.2',
]

[project.optional-dependencies]
download = ['kaggle>=1.6']
interpretability = ['captum>=0.7']
dev = [
    'build>=1.0',
    'mypy>=1.8',
    'nbformat>=5.9',
    'pytest>=8.0',
    'ruff>=0.4',
]

[tool.setuptools.packages.find]
where = ['src']

[tool.ruff]
line-length = 96
target-version = 'py311'

[tool.ruff.format]
quote-style = 'single'
indent-style = 'space'

[tool.ruff.lint]
select = ['E', 'F', 'I', 'UP', 'B']
ignore = ['E501']
